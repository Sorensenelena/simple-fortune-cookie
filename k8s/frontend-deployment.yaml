apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortune-frontend
  labels:
    app: fortune-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fortune-frontend
  template:
    metadata:
      labels:
        app: fortune-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sorensenelena/simple-fortune-cookie-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fortune-frontend-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
