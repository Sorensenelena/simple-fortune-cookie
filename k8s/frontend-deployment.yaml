apiVersion: v1
kind: Deployment
metadata:
  name: fortune-frontend
  labels:
    app: fortune-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fortune-frontend
  template:
    metadata:
      labels:
        app: fortune-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sorensenelena/simple-fortune-cookie-frontend:latest
          ports:
            - containerPort: 8080
