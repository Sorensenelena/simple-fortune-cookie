apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortune-backend
  labels:
    app: fortune-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fortune-backend
  template:
    metadata:
      labels:
        app: fortune-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/sorensenelena/simple-fortune-cookie-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: fortune-backend-config
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 20
