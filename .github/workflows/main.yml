name: CI
on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env: # Set the secret as an input
  github_username: sorensenelena
  github_password: ${{ secrets.GITHUB_TOKEN }} # Must be made available to the workflow
  GIT_COMMIT: ${{ github.sha }}
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build backend
        working-directory: backend
        run: go build -o backend .

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Build frontend
        working-directory: frontend
        run: go build -o frontend .

      - name: Test frontend
        working-directory: frontend
        run: go test ./...

      - name: Upload repo
        uses: actions/upload-artifact@v7
        with:
          name: repo
          path: .
          include-hidden-files: true

  Linting:
    runs-on: ubuntu-latest
    needs: [Build]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: run linting
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ERRORS: true
  Publish:
    runs-on: ubuntu-latest
    needs: [Build, Linting]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/simple-fortune-cookie-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/simple-fortune-cookie-frontend:latest
