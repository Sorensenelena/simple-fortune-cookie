name: CD (production)


on:
  push:
    branches: [ "main" ]

env:
  IMAGE_BACKEND: ghcr.io/sorensenelena/simple-fortune-cookie-backend
  IMAGE_FRONTEND: ghcr.io/sorensenelena/simple-fortune-cookie-frontend

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Build backend
        working-directory: backend
        run: go build -o backend .
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Build frontend
        working-directory: frontend
        run: go build -o frontend .
      - name: Test frontend
        working-directory: frontend
        run: go test ./...

  Linting:
    runs-on: ubuntu-latest
    needs: [ Build ]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run linting
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ERRORS: true

  publish:
    runs-on: ubuntu-latest
    needs: [ Build, Linting ]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kakam22
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ publish ]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Deploy commit images
        run: |
          kubectl set image deployment/fortune-backend \
            backend="${IMAGE_BACKEND}:${GITHUB_SHA}"
      
          kubectl set image deployment/fortune-frontend \
            frontend="${IMAGE_FRONTEND}:${GITHUB_SHA}"
      
          kubectl rollout status deployment/fortune-backend --timeout=120s
          kubectl rollout status deployment/fortune-frontend --timeout=120s
          kubectl rollout status deployment/fortune-redis --timeout=120s

  smoke-test:
    runs-on: ubuntu-latest
    needs: [ deploy ]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Port-forward frontend service
        run: |
          kubectl port-forward svc/fortune-frontend 8080:8080 &
          echo $! > /tmp/pf.pid
          sleep 5

      - name: Run smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh http://localhost:8080

      - name: Stop port-forward
        if: always()
        run: kill "$(cat /tmp/pf.pid)" || true
