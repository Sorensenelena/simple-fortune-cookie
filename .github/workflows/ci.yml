name: CI (development)

on:
  push:
    branches-ignore: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Build backend
        working-directory: backend
        run: go build -o backend .
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Build frontend
        working-directory: frontend
        run: go build -o frontend .
      - name: Test frontend
        working-directory: frontend
        run: go test ./...

  Linting:
    runs-on: ubuntu-latest
    needs: [ Build ]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run linting
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ERRORS: true

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [ Build, Linting ]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v7

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: simple-fortune-cookie-backend:ci

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: simple-fortune-cookie-frontend:ci
